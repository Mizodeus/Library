<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="library">
        <button class="addBook">Add New Book</button>

        <div class="container">
            
        </div>
    </div>

    <dialog id="addBookDialog">
        <p>Add New Book</p>
        <form method="dialog">
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Fight Club" required>
            </div>
            <div>
                <label for="pages">Pages</label>
                <input type="number" id="pages" name="pages" placeholder="224" required>
            </div>
            <div>
                <label for="author">Author</label>
                <input type="text" id="author" name="author" placeholder="Chuck Palahniuk" required>
            </div>
            <div>
                <label for="isRead">Read</label>
                <input type="checkbox" id="isRead" name="isRead" required>
            </div>
            <button type="submit">Submit</button>
            <button type="button" id="cancelButton">Cancel</button>
        </form>
    </dialog>
</body>
</html>
